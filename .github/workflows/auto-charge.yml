name: Neptune Auto Charge

on:
  # 全天每半小时运行一次：GitHub 使用 UTC，对应北京时间每小时的 00、30 分
  schedule:
    - cron: '0,30 * * * *'

  # 支持手动触发（用于测试）
  workflow_dispatch:

jobs:
  auto-charge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -p "test_*.py"

      - name: Create .env file
        run: |
          echo "NEPTUNE_OPEN_ID=${{ secrets.NEPTUNE_OPEN_ID }}" >> .env
          echo "NEPTUNE_AREA_ID=${{ secrets.NEPTUNE_AREA_ID }}" >> .env
          echo "NEPTUNE_EMPLOYEE_ID=${{ secrets.NEPTUNE_EMPLOYEE_ID }}" >> .env

      - name: Run auto charge script
        run: |
          python main.py
